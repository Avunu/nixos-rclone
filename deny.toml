[advisories]
version = 2
ignore = [
  # chrono is unmaintained (no fixed release exists), and reaches this tree
  # only through rclone-sdk, which pins it. Nothing here calls chrono directly.
  # Drop this entry once a rclone-sdk release no longer depends on chrono.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono, no safe upgrade; transitive via rclone-sdk" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  # progenitor-client, via rclone-sdk: file-level copyleft, used unmodified.
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
