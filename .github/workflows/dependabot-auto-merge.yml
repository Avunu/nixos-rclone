name: Dependabot auto-merge

# Enables auto-merge on every Dependabot PR, in every ecosystem — nix lock bumps
# included. GitHub then merges it once the branch is mergeable and all
# *required* status checks pass. Tests are the gate, not review.
#
# Requires (one-time, in repo settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • A ruleset on `main` requiring a pull request and the checks.yml status
#     checks "fast (x86_64-linux)", "fast (aarch64-linux)" and "vm". Without
#     it, `gh pr merge --auto` merges on nothing.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # The pull request's author, not `github.actor`: the actor is whoever
    # triggered this run, and a human re-running it on a Dependabot PR would
    # otherwise be treated like the bot.
    # Updates of the documentation site's packages (docs-site/) and of the commit pin of its shared
    # workflows (github-actions pull requests) are reviewed by a person: a merge to the default branch
    # publishes the site.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/docs-site') && !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
